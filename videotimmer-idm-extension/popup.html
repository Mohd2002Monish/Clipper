<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoTimmer IDM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 13px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .section-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .url-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 600;
    }
    select, input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 12px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #38bdf8;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.3s ease;
    }
    .logs-container {
      margin-top: 10px;
      padding: 8px;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: #94a3b8;
      max-height: 120px;
      overflow-y: auto;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .icon {
      width: 14px;
      height: 14px;
    }
    .feedback-msg {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      display: none;
      margin-top: 8px;
    }
    .feedback-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .feedback-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">VT</div>
      <div class="brand-title">VideoTimmer IDM</div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="section-card">
    <div class="card-label">Active Page Video</div>
    <div id="activeUrl" class="url-display">Detecting active tab...</div>

    <div class="form-group">
      <label class="form-label" for="qualitySelect">Download Quality</label>
      <select id="qualitySelect">
        <option value="best" selected>Max Quality (4K / 1080p Best)</option>
        <option value="1080p">1080p Full HD</option>
        <option value="720p">720p HD</option>
        <option value="audio">Audio Only (MP3)</option>
      </select>
    </div>

    <div class="btn-group">
      <button type="button" id="btnDownloadLocal" class="btn btn-primary">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Local
      </button>

      <button type="button" id="btnUploadDrive" class="btn btn-secondary">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        Save to Google Drive
      </button>
    </div>

    <div id="progressBarWrap" class="progress-bar-wrap">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>

    <div id="feedbackMsg" class="feedback-msg"></div>
  </div>

  <div class="section-card">
    <div class="card-label">Preferences</div>
    <div class="form-group">
      <label class="form-label" for="folderSelect">Target Drive Folder</label>
      <select id="folderSelect">
        <option value="Shorts">Shorts</option>
        <option value="Movie-Vault">Movie-Vault</option>
        <option value="GTA-5">GTA-5</option>
        <option value="General">General</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="serverUrlInput">VideoTimmer Backend URL</label>
      <input type="text" id="serverUrlInput" value="http://localhost:3000">
    </div>
  </div>

  <div class="section-card">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span class="card-label">IDM Engine Logs</span>
      <a id="btnToggleLogs" style="font-size: 11px; color: #38bdf8; cursor: pointer;">View Logs</a>
    </div>
    <div id="logsBox" class="logs-container">Loading logs...</div>
  </div>

  <div class="footer">
    <span>VideoTimmer Suite</span>
    <a href="http://localhost:3000/?tab=clip-ingest" target="_blank" id="linkDashboard">Open Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
